name: Sync StackChan upstream

on:
  push:
    branches:
      - codex/timothee-factory-1.6.0
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      branch: ${{ steps.sync.outputs.branch }}
    concurrency:
      group: stackchan-upstream-sync
      cancel-in-progress: false
    env:
      EXTENSION_BRANCH: codex/timothee-factory-1.6.0
      UPSTREAM_REPOSITORY: https://github.com/m5stack/StackChan.git

    steps:
      - name: Checkout extension branch
        uses: actions/checkout@v4
        with:
          ref: codex/timothee-factory-1.6.0
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main and tags
        run: |
          git remote add upstream "$UPSTREAM_REPOSITORY"
          git fetch --prune --tags upstream main

      - name: Validate factory backup gate tooling
        run: |
          node --check tools/verify_factory_backup.mjs
          node --check tools/create_factory_manifest.mjs
          node --check tools/verify_factory_release.mjs
          node --check tools/verify_workflow_security.test.mjs
          node --test tools/create_factory_manifest.test.mjs tools/verify_factory_backup.test.mjs tools/verify_factory_release.test.mjs tools/verify_workflow_security.test.mjs

      - name: Prepare and validate sync branch
        id: sync
        run: |
          run_host_tests() {
            cmake -S firmware/tests -B "$RUNNER_TEMP/stackchan-tests"
            cmake --build "$RUNNER_TEMP/stackchan-tests" --parallel
            ctest --test-dir "$RUNNER_TEMP/stackchan-tests" --output-on-failure
          }

          run_firmware_build() {
            # ESP-IDF embeds __DATE__/__TIME__ in the app descriptor. Pin the
            # compiler's source date to the checked-out commit so the same
            # commit produces the same image hash across CI runs.
            source_date_epoch="$(git show -s --format=%ct HEAD)"

            # Fetch dependencies in the isolated CI workspace first. The actual
            # compiler step has no network, no USB device and no credentials.
            docker run --rm \
              --env "SOURCE_DATE_EPOCH=$source_date_epoch" \
              --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/work" \
              --workdir /work/firmware \
              espressif/idf:v5.5.4 \
              bash -lc 'set -euo pipefail; python3 fetch_repos.py; idf.py reconfigure'

            # Build-only gate. Deliberately excludes every
            # flash/deploy/monitor operation and blocks build-time egress.
            docker run --rm \
              --network none \
              --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --env "SOURCE_DATE_EPOCH=$source_date_epoch" \
              --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/work" \
              --workdir /work/firmware \
              espressif/idf:v5.5.4 \
              bash -lc 'idf.py build'
          }

          if git merge-base --is-ancestor upstream/main "origin/$EXTENSION_BRANCH"; then
            git diff --check
            run_host_tests
            run_firmware_build
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The extension branch already contains upstream/main; baseline and firmware-build validation passed."
            exit 0
          fi

          sync_branch="automation/upstream-sync-${GITHUB_RUN_ID}"
          git switch --create "$sync_branch" "origin/$EXTENSION_BRANCH"
          git merge --no-edit --no-ff upstream/main
          git diff --check
          run_host_tests
          run_firmware_build

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$sync_branch" >> "$GITHUB_OUTPUT"

          git bundle create "$RUNNER_TEMP/stackchan-sync.bundle" "$sync_branch"

      - name: Upload verified sync bundle
        if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stackchan-sync-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/stackchan-sync.bundle
          if-no-files-found: error
          retention-days: 7

  publish:
    if: needs.sync.outputs.changed == 'true'
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      EXTENSION_BRANCH: codex/timothee-factory-1.6.0
      SYNC_BRANCH: ${{ needs.sync.outputs.branch }}

    steps:
      - name: Checkout extension branch
        uses: actions/checkout@v4
        with:
          ref: codex/timothee-factory-1.6.0
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified sync bundle
        uses: actions/download-artifact@v4
        with:
          name: stackchan-sync-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/stackchan-sync

      # This job receives only the already-validated Git object bundle. It does
      # not fetch, merge, compile, install dependencies or execute repository
      # code before using its narrowly scoped write token.
      - name: Publish review branch and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$SYNC_BRANCH" in
            automation/upstream-sync-[0-9]*) ;;
            *) echo "unexpected sync branch" >&2; exit 1 ;;
          esac

          bundle="$RUNNER_TEMP/stackchan-sync/stackchan-sync.bundle"
          git bundle verify "$bundle"
          sync_sha="$(git bundle list-heads "$bundle" | awk -v expected="refs/heads/$SYNC_BRANCH" '$2 == expected { print $1; exit }')"
          test -n "$sync_sha"
          git fetch "$bundle" "$sync_sha"

          gh auth setup-git
          git push origin "$sync_sha:refs/heads/$SYNC_BRANCH"
          gh pr create \
            --base "$EXTENSION_BRANCH" \
            --head "$SYNC_BRANCH" \
            --title "chore: sync StackChan upstream" \
            --body "Automated upstream sync from m5stack/StackChan. The branch was merged without conflict, passed git diff --check and the host CMake tests. Review firmware changes before merging; this workflow never flashes hardware."
